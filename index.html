<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: rgba(17, 17, 17, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      border: 0.5px solid #2a2a2a;
    }

    /* Drag handle en haut */
    #titlebar {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      -webkit-app-region: drag;
      cursor: grab;
      background: transparent;
      border-radius: 14px 14px 0 0;
      flex-shrink: 0;
    }

    #titlebar:active {
      cursor: grabbing;
    }

    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
      flex-shrink: 0;
    }

    #title-label {
      flex: 1;
      font-size: 13px;
      color: #555;
    }

    .tb-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      transition: background 0.15s;
    }

    #btn-toggle {
      background: #1e1e1e;
    }

    #btn-toggle:hover {
      background: #2a2a2a;
    }

    #btn-toggle svg {
      width: 14px;
      height: 14px;
      fill: #666;
      transition: transform 0.25s;
    }

    #btn-hide {
      background: #1e1e1e;
    }

    #btn-hide:hover {
      background: #2a2a2a;
    }

    #btn-hide svg {
      width: 10px;
      height: 10px;
      fill: #666;
    }

    #btn-quit {
      background: #2a1a1a;
    }

    #btn-quit:hover {
      background: #3a1a1a;
    }

    #btn-quit svg {
      width: 10px;
      height: 10px;
      stroke: #e24b4a;
    }

    /* Main content */
    #content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    #content.visible {
      display: flex;
    }

    /* Tabs */
    #tabs {
      display: flex;
      padding: 0 14px;
      gap: 2px;
      border-bottom: 0.5px solid #1e1e1e;
      flex-shrink: 0;
    }

    .tab {
      font-size: 12px;
      color: #444;
      padding: 7px 10px;
      cursor: pointer;
      border-bottom: 1.5px solid transparent;
      transition: color 0.15s;
      -webkit-app-region: no-drag;
    }

    .tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* Chat */
    #chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    #chat-view.hidden {
      display: none;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }

    .msg {
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .msg.user {
      align-self: flex-end;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      font-size: 12px;
      text-align: left;
      max-width: 85%;
      border-bottom-right-radius: 2px;
    }

    .msg.ai {
      align-self: flex-start;
      color: #e4e4e4;
      background: rgba(255, 255, 255, 0.06);
      border: 0.5px solid rgba(255, 255, 255, 0.05);
      max-width: 95%;
      border-bottom-left-radius: 2px;
    }

    .msg.ai.streaming::after {
      content: '▌';
      animation: blink .7s infinite;
      color: #4285f4;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    #input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    #prompt {
      flex: 1;
      background: rgba(30, 30, 30, 0.55);
      border: 0.5px solid #2a2a2a;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      color: #ddd;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 36px;
      max-height: 100px;
      line-height: 1.5;
      overflow-y: auto;
    }

    #prompt::placeholder {
      color: #3a3a3a;
    }

    #prompt:focus {
      border-color: rgba(255, 255, 255, 0.25);
    }

    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }

    #send-btn:hover {
      opacity: 0.85;
      background: rgba(255, 255, 255, 0.25);
    }

    #send-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 14px;
      height: 14px;
      fill: white;
    }



    /* Webview */
    #web-view-wrap {
      flex: 1;
      display: none;
      min-height: 0;
      background: transparent !important;
    }

    #web-view-wrap.active {
      display: flex;
    }

    webview {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
    }

    #messages::-webkit-scrollbar {
      width: 3px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 2px;
    }

    /* Light Theme Styles */
    body.light-theme {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 0.5px solid #ccc;
    }

    body.light-theme #titlebar {
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
    }

    body.light-theme #title-label {
      color: #222;
    }

    body.light-theme .tab {
      color: #555;
    }

    body.light-theme .tab.active {
      color: #111;
      border-bottom-color: #111;
    }

    body.light-theme .msg.user {
      color: #111;
      background: rgba(0, 0, 0, 0.06);
      border: 0.5px solid rgba(0, 0, 0, 0.08);
    }

    body.light-theme .msg.ai {
      color: #111;
      background: rgba(255, 255, 255, 0.6);
      border: 0.5px solid rgba(0, 0, 0, 0.05);
    }

    body.light-theme #prompt {
      background: rgba(255, 255, 255, 0.75);
      border: 0.5px solid #ccc;
      color: #111;
    }

    body.light-theme #prompt::placeholder {
      color: #888;
    }

    body.light-theme #prompt:focus {
      border-color: rgba(0, 0, 0, 0.25);
    }

    body.light-theme #tabs {
      border-bottom: 0.5px solid #e2e2e2;
    }

    body.light-theme .tb-btn {
      background: #e5e5e5;
    }

    body.light-theme .tb-btn:hover {
      background: #d8d8d8;
    }

    body.light-theme .tb-btn svg {
      fill: #333;
    }

    body.light-theme #btn-quit {
      background: #fadbd8;
    }

    body.light-theme #btn-quit:hover {
      background: #f5b7b1;
    }

    body.light-theme #btn-quit svg {
      stroke: #d9534f;
    }

    body.light-theme #send-btn {
      background: rgba(0, 0, 0, 0.1);
    }

    body.light-theme #send-btn:hover {
      background: rgba(0, 0, 0, 0.18);
    }

    body.light-theme #send-btn svg {
      fill: #222;
    }



    /* Import session button styling */
    #btn-import-cookie {
      color: #888 !important;
    }
    #btn-import-cookie:hover {
      color: #aaa !important;
    }
    body.light-theme #btn-import-cookie {
      color: #666 !important;
    }
    body.light-theme #btn-import-cookie:hover {
      color: #111 !important;
    }
  </style>
</head>

<body>

  <div id="titlebar">
    <div id="dot"></div>
    <span id="title-label">Gemini</span>
    <button class="tb-btn" id="btn-theme" title="Changer de thème">
      <svg viewBox="0 0 24 24" id="theme-icon">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" fill="#666"/>
      </svg>
    </button>
    <button class="tb-btn" id="btn-toggle" title="Expand/Collapse">
      <svg viewBox="0 0 24 24">
        <path d="M7 10l5 5 5-5z" />
      </svg>
    </button>
    <button class="tb-btn" id="btn-hide" title="Masquer">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="11" width="16" height="2" fill="#666" />
      </svg>
    </button>
    <button class="tb-btn" id="btn-quit" title="Quitter">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 6l12 12M18 6L6 18" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <div id="content">
    <div id="tabs" style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; gap: 2px;">
        <div class="tab active" data-tab="chat">Chat</div>
        <div class="tab" data-tab="web">Gemini</div>
      </div>
      <div class="tab" id="btn-import-cookie"
        style="color: #888; font-size: 11px; margin-left: auto; border-bottom: none; -webkit-app-region: no-drag; transition: color 0.15s;">
        Importer Session</div>
    </div>

    <div id="chat-view">
      <div id="messages"></div>
      <div id="input-row" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; width: 100%; gap: 8px; align-items: flex-end;">
          <textarea id="prompt" placeholder="Message..." rows="1"></textarea>
          <button id="send-btn">
            <svg viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="web-view-wrap">
      <webview id="gemini-webview" src="https://gemini.google.com" partition="persist:gemini"
        useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
        allowpopups></webview>
    </div>
  </div>

  <!-- Cookie Import Modal -->
  <div id="cookie-modal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div
      style="background: #1a1a1a; border: 0.5px solid #2e2e2e; border-radius: 12px; width: 100%; max-width: 340px; padding: 18px; box-shadow: 0 12px 36px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 12px; -webkit-app-region: no-drag;">
      <h3 style="font-size: 13px; color: #fff; font-weight: 500; letter-spacing: 0.3px;">Importer la session Gemini</h3>
      <p style="font-size: 10px; color: #888; line-height: 1.4;">
        Collez le JSON exporté par l'extension <b>Cookie-Editor</b> ou la valeur de l'en-tête <b>Cookie</b> du Network
        tab :
      </p>
      <textarea id="cookie-input" placeholder="Collez le JSON ou la chaîne de cookies ici (Ctrl+V)..."
        style="width: 100%; height: 90px; background: #111; border: 0.5px solid #2e2e2e; border-radius: 6px; padding: 8px; font-size: 10px; color: #ddd; font-family: monospace; resize: none; outline: none;"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="cookie-cancel"
          style="background: transparent; border: none; color: #666; font-size: 11px; cursor: pointer; padding: 6px 10px; transition: color 0.15s;">Annuler</button>
        <button id="cookie-submit"
          style="background: #4285f4; border: none; color: #fff; border-radius: 6px; font-size: 11px; cursor: pointer; padding: 6px 14px; font-weight: 500; transition: opacity 0.15s;">Importer</button>
      </div>
    </div>
  </div>

  </div>

  <script>
    const ipcRenderer = {
      send: (channel, ...args) => {
        if (window.electronAPI) {
          window.electronAPI.send(channel, ...args);
        }
      },
      on: (channel, func) => {
        if (window.electronAPI) {
          window.electronAPI.on(channel, func);
        }
      }
    };

    const content = document.getElementById('content');
    const btnToggle = document.getElementById('btn-toggle');
    const btnHide = document.getElementById('btn-hide');
    const btnQuit = document.getElementById('btn-quit');
    const titleLabel = document.getElementById('title-label');
    const prompt = document.getElementById('prompt');
    const sendBtn = document.getElementById('send-btn');
    const messages = document.getElementById('messages');
    const webview = document.getElementById('gemini-webview');
    const webViewWrap = document.getElementById('web-view-wrap');
    const chatView = document.getElementById('chat-view');
    const toggleSvg = btnToggle.querySelector('svg');
    const btnImportCookie = document.getElementById('btn-import-cookie');

    const cookieModal = document.getElementById('cookie-modal');
    const cookieInput = document.getElementById('cookie-input');
    const cookieCancel = document.getElementById('cookie-cancel');
    const cookieSubmit = document.getElementById('cookie-submit');

    let expanded = false;
    let isStreaming = false;

    webview.addEventListener('console-message', (e) => {
      console.log('Webview console:', e.message);
      ipcRenderer.send('webview-log', e.message);
    });

    const btnTheme = document.getElementById('btn-theme');
    const themeIcon = document.getElementById('theme-icon');

    // Sun SVG path
    const sunPath = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.02-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.38-.38.38-1.02 0-1.41zM5.99 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41z" fill="#666"/>`;
    // Moon SVG path
    const moonPath = `<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" fill="#666"/>`;

    // Load saved theme preference
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.add('light-theme');
      themeIcon.innerHTML = sunPath;
    } else {
      themeIcon.innerHTML = moonPath;
    }

    btnTheme.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      themeIcon.innerHTML = isLight ? sunPath : moonPath;
      updateWebviewTheme();
    });

    function updateWebviewTheme() {
      const isLight = document.body.classList.contains('light-theme');
      webview.executeJavaScript(`
        document.documentElement.classList.toggle('light-theme', ${isLight});
        document.body.classList.toggle('light-theme', ${isLight});
      `).catch(err => console.error("Error setting guest theme class:", err));
    }

    webview.addEventListener('dom-ready', () => {
      const css = `
        /* Overwrite Google Gemini Material 3 Design Tokens */
        :root, html, body, [role="main"], mat-sidenav-container, mat-sidenav-content, mat-sidenav, impl-app-layout, gmat-app-layout, .gmat-app-layout {
          --gm3-sys-color-surface: transparent !important;
          --gm3-sys-color-surface-container: transparent !important;
          --gm3-sys-color-surface-container-low: transparent !important;
          --gm3-sys-color-surface-container-lowest: transparent !important;
          --gm3-sys-color-surface-container-high: transparent !important;
          --gm3-sys-color-surface-container-highest: transparent !important;
          --gm3-sys-color-background: transparent !important;
          --gm3-sys-color-surface-variant: transparent !important;
          
          --sys-color-surface: transparent !important;
          --sys-color-surface-container: transparent !important;
          --sys-color-surface-container-low: transparent !important;
          --sys-color-surface-container-lowest: transparent !important;
          --sys-color-surface-container-high: transparent !important;
          --sys-color-surface-container-highest: transparent !important;
          --sys-color-background: transparent !important;
          --sys-color-surface-variant: transparent !important;

          /* Neutral primary colors to avoid blue accent spots */
          --gm3-sys-color-primary: #e3e3e3 !important;
          --sys-color-primary: #e3e3e3 !important;
          --gm3-sys-color-on-primary: #111111 !important;
          --sys-color-on-primary: #111111 !important;
          --gm3-sys-color-outline: rgba(128, 128, 128, 0.2) !important;
          --sys-color-outline: rgba(128, 128, 128, 0.2) !important;
          --gm3-sys-color-outline-variant: rgba(128, 128, 128, 0.1) !important;
          --sys-color-outline-variant: rgba(128, 128, 128, 0.1) !important;
        }

        /* Direct light theme overrides for the webview content */
        html.light-theme, body.light-theme, html.light-theme [role="main"], html.light-theme mat-sidenav-container, html.light-theme mat-sidenav-content {
          --gm3-sys-color-on-surface: #1f1f1f !important;
          --sys-color-on-surface: #1f1f1f !important;
          --gm3-sys-color-on-background: #1f1f1f !important;
          --sys-color-on-background: #1f1f1f !important;
          --gm3-sys-color-on-surface-variant: #4f4f4f !important;
          --sys-color-on-surface-variant: #4f4f4f !important;
          
          --gm3-sys-color-primary: #1f1f1f !important;
          --sys-color-primary: #1f1f1f !important;
          --gm3-sys-color-on-primary: #ffffff !important;
          --sys-color-on-primary: #ffffff !important;
        }

        /* Ensure all core webview text is readable in light theme */
        html.light-theme p, html.light-theme div, html.light-theme span, html.light-theme h1, html.light-theme h2, html.light-theme h3 {
          color: #1f1f1f;
        }

        html.light-theme .conversation-container, html.light-theme .main-content {
          color: #1f1f1f !important;
        }

        /* Style user query bubble in Gemini webview with neutral colors */
        user-query, .user-query, .user-query-bubble-with-background {
          background-color: rgba(255, 255, 255, 0.08) !important;
          color: #ffffff !important;
          border: 0.5px solid rgba(255, 255, 255, 0.1) !important;
        }

        /* Light theme user query bubble */
        html.light-theme user-query, 
        html.light-theme .user-query, 
        html.light-theme .user-query-bubble-with-background {
          background-color: rgba(0, 0, 0, 0.06) !important;
          color: #1f1f1f !important;
          border: 0.5px solid rgba(0, 0, 0, 0.08) !important;
        }

        html.light-theme user-query *, 
        html.light-theme .user-query *, 
        html.light-theme .user-query-bubble-with-background * {
          color: #1f1f1f !important;
        }

        /* Direct layout component overrides */
        html, body, main, header, [role="main"], 
        mat-sidenav-container, mat-sidenav-content, mat-sidenav,
        impl-app-layout, gmat-app-layout, .gmat-app-layout, .app-layout,
        .chat-view, .chat-history, .conversation-layout,
        .main-content, .chat-history-container, .conversation-container,
        .sidebar, .left-nav, .navigation, activity-feed, .activity-feed,
        .left-nav-container, .right-nav-container,
        aside, [data-test-id="sidebar"], .gb_Ld, .gb_Kd, .gb_Id, .gb_Jd, .gb_V, .gb_T,
        chat-window, .chat-window,
        [class*="gradient"], [class*="scrim"], input-container, .input-gradient, .input-container, .autosuggest-scrim, .discovery-feed-theme, .input-area-v2, input-area-v2, .input-box-shadow, .ui-improvements-phase-1 {
          background: transparent !important;
          background-color: transparent !important;
          background-image: none !important;
          box-shadow: none !important;
        }

        /* Override pseudo-elements containing gradients or background overlays */
        chat-window::before, chat-window::after,
        .chat-window::before, .chat-window::after,
        [class*="gradient"]::before, [class*="gradient"]::after,
        [class*="scrim"]::before, [class*="scrim"]::after,
        .conversation-container::before, .conversation-container::after,
        .main-content::before, .main-content::after {
          background: transparent !important;
          background-color: transparent !important;
          background-image: none !important;
          display: none !important;
        }

        /* Strip all focus outline borders and shadows to remove blue spots */
        span.mat-focus-indicator::before,
        span.mat-focus-indicator::after,
        .mat-mdc-focus-indicator::before,
        .mat-mdc-focus-indicator::after,
        .mat-focus-indicator::before,
        .mat-focus-indicator::after,
        .focus-indicator::before,
        .focus-indicator::after,
        .mat-focus-indicator,
        .mat-mdc-focus-indicator,
        a:focus, button:focus, input:focus, textarea:focus, [tabindex]:focus {
          border: none !important;
          outline: none !important;
          box-shadow: none !important;
        }
        
        /* Ensure focus rings do not render as pseudo elements */
        span.mat-focus-indicator::before,
        span.mat-focus-indicator::after,
        .mat-mdc-focus-indicator::before,
        .mat-mdc-focus-indicator::after {
          display: none !important;
        }

        /* Webview scrollbar styling */
        ::-webkit-scrollbar {
          width: 4px !important;
          height: 4px !important;
          background: transparent !important;
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(128, 128, 128, 0.3) !important;
          border-radius: 4px !important;
        }
        ::-webkit-scrollbar-track {
          background: transparent !important;
        }

        /* Caret cursor and selection rules */
        * {
          caret-color: currentColor !important;
        }
        ::selection {
          background-color: rgba(128, 128, 128, 0.25) !important;
          color: inherit !important;
        }
      `;
      try {
        webview.insertCSS(css);
      } catch (e) {
        console.error("Failed to inject transparent CSS:", e);
      }

      // Sync active theme state on DOM ready
      updateWebviewTheme();
    });

    btnToggle.addEventListener('click', () => {
      expanded = !expanded;
      content.classList.toggle('visible', expanded);
      toggleSvg.style.transform = expanded ? 'rotate(180deg)' : '';
      ipcRenderer.send('toggle-expand');
      if (expanded) setTimeout(() => prompt.focus(), 350);
    });

    btnHide.addEventListener('click', () => ipcRenderer.send('hide-app'));
    btnQuit.addEventListener('click', () => ipcRenderer.send('close-app'));

    btnImportCookie.addEventListener('click', () => {
      cookieInput.value = '';
      cookieModal.style.display = 'flex';
      cookieInput.focus();
    });

    cookieCancel.addEventListener('click', () => {
      cookieModal.style.display = 'none';
    });

    cookieSubmit.addEventListener('click', () => {
      const cookieStr = cookieInput.value.trim();
      if (cookieStr) {
        ipcRenderer.send('import-cookies', cookieStr);
        cookieModal.style.display = 'none';
      }
    });

    ipcRenderer.on('import-cookies-success', () => {
      alert("Session importée avec succès ! Redirection vers Gemini...");
      webview.src = 'https://gemini.google.com';
    });

    ipcRenderer.on('import-cookies-error', (errMsg) => {
      alert("Erreur d'importation : " + errMsg);
    });

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const name = tab.dataset.tab;
        chatView.classList.toggle('hidden', name !== 'chat');
        webViewWrap.classList.toggle('active', name === 'web');
        if (name === 'chat') setTimeout(() => prompt.focus(), 100);
      });
    });

    let attachedImageBase64 = null;

    // Textarea resize
    prompt.addEventListener('input', () => {
      prompt.style.height = 'auto';
      prompt.style.height = Math.min(prompt.scrollHeight, 100) + 'px';
    });

    prompt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // Handle image pasting in native prompt
    prompt.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => {
            attachedImageBase64 = event.target.result;
            const preview = document.getElementById('image-preview');
            const previewImg = document.getElementById('image-preview-img');
            previewImg.src = attachedImageBase64;
            preview.style.display = 'block';
          };
          reader.readAsDataURL(file);
          e.preventDefault(); // Prevent standard text pasting if it's an image
        }
      }
    });

    document.getElementById('btn-remove-image').addEventListener('click', () => {
      attachedImageBase64 = null;
      document.getElementById('image-preview').style.display = 'none';
      prompt.focus();
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = prompt.value.trim();
      if ((!text && !attachedImageBase64) || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      prompt.value = '';
      prompt.style.height = 'auto';
      titleLabel.textContent = '...';

      // Capture active image and reset preview uploader immediately
      const imageToSend = attachedImageBase64;
      attachedImageBase64 = null;
      document.getElementById('image-preview').style.display = 'none';

      addMsg('user', text, imageToSend);
      const aiBubble = addMsg('ai', '');
      aiBubble.classList.add('streaming');

      try {
        if (imageToSend) {
          // 1. Programmatically inject the image file into the Gemini uploader
          await webview.executeJavaScript(`
            (async () => {
              const res = await fetch(${JSON.stringify(imageToSend)});
              const blob = await res.blob();
              const file = new File([blob], 'image.png', { type: blob.type });
              const fileInput = document.querySelector('input[type="file"]') || document.querySelector('input[accept*="image"]');
              if (fileInput) {
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                fileInput.files = dataTransfer.files;
                fileInput.dispatchEvent(new Event('change', { bubbles: true }));
              }
            })()
          `);
          // Wait 1.2s for Gemini interface to process file upload
          await sleep(1200);
        }

        // 2. Type text query and click Send
        await webview.executeJavaScript(`
          (async () => {
            const input = document.querySelector('div.ql-editor.textarea');
            if (!input) throw new Error('input not found');
            input.focus();
            document.execCommand('selectAll');
            document.execCommand('insertText', false, ${JSON.stringify(text)});
            await new Promise(r => setTimeout(r, 400));
            const btn = document.querySelector('button[aria-label="Send message"]');
            if (btn) btn.click();
          })()
        `);

        const countBefore = await webview.executeJavaScript(
          `document.querySelectorAll('div.response-content').length`
        );

        await waitFor(async () => {
          const count = await webview.executeJavaScript(
            `document.querySelectorAll('div.response-content').length`
          );
          return count > countBefore;
        }, 15000);

        await waitForStable();

        const reply = await webview.executeJavaScript(`
          (() => {
            const all = document.querySelectorAll('div.response-content');
            return all[all.length - 1]?.innerText || '';
          })()
        `);

        aiBubble.textContent = reply || '(pas de réponse)';
        titleLabel.textContent = 'Gemini';

      } catch (err) {
        aiBubble.textContent = '⚠ ' + err.message;
        titleLabel.textContent = 'Gemini';
      } finally {
        aiBubble.classList.remove('streaming');
        isStreaming = false;
        sendBtn.disabled = false;
        messages.scrollTop = messages.scrollHeight;
      }
    }

    function addMsg(role, text, base64Img = null) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      
      if (base64Img) {
        const img = document.createElement('img');
        img.src = base64Img;
        img.style.maxWidth = '100%';
        img.style.maxHeight = '120px';
        img.style.borderRadius = '8px';
        img.style.marginBottom = '6px';
        img.style.display = 'block';
        div.appendChild(img);
      }
      
      if (text) {
        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        div.appendChild(textSpan);
      }
      
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function waitFor(fn, timeout = 10000) {
      return new Promise((resolve, reject) => {
        const start = Date.now();
        const iv = setInterval(async () => {
          try {
            if (await fn()) { clearInterval(iv); resolve(); }
            if (Date.now() - start > timeout) { clearInterval(iv); reject(new Error('Timeout')); }
          } catch (e) { clearInterval(iv); reject(e); }
        }, 200);
      });
    }

    async function waitForStable() {
      let last = '', stable = 0;
      for (let i = 0; i < 150; i++) {
        await sleep(200);
        const cur = await webview.executeJavaScript(`
      (() => {
        const all = document.querySelectorAll('div.response-content');
        const processing = document.querySelector('structured-content-container.processing-state-visible');
        return (all[all.length-1]?.innerText || '') + (processing ? '__loading' : '');
      })()
    `);
        if (cur === last && !cur.includes('__loading') && cur.length > 0) {
          if (++stable >= 3) return;
        } else { stable = 0; last = cur; }
      }
    }


  </script>
